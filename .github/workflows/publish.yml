name: Publish to npm

# Publishes when a GitHub release is created. Authenticates via npm
# trusted publishing (GitHub Actions OIDC) — no npm token is stored
# anywhere. The trusted publisher for this workflow is configured on
# npmjs.com under the package's Settings.
on:
  release:
    types: [published]

# Read-only at the top level; write grants live on the job that needs
# them, so a job added later cannot inherit them by accident.
permissions:
  contents: read

# A duplicate release event must never race another publish for the same
# immutable npm version. Do not cancel a publish that may already have
# reached the registry; the workflow's idempotent recovery path completes it.
concurrency:
  group: publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  # Build and inspect the release without OIDC or write permissions. The
  # compiler, linter, tests, and their transitive dependencies execute here,
  # where none of them can request npm publishing credentials.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      tarball_sha256: ${{ steps.artifact_hashes.outputs.tarball_sha256 }}
      sbom_sha256: ${{ steps.artifact_hashes.outputs.sbom_sha256 }}
    steps:
      # This job executes third-party development tools, so block unexpected
      # egress even though its token is read-only and it has no OIDC access.
      # tuf-repo-cdn.sigstore.dev serves the Sigstore trust root that
      # `npm audit signatures` uses to verify provenance attestations.
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            nodejs.org:443
            objects.githubusercontent.com:443
            registry.npmjs.org:443
            release-assets.githubusercontent.com:443
            tuf-repo-cdn.sigstore.dev:443

      # Actions pinned to commit SHAs so a compromised tag cannot inject code.
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No step pushes; do not leave the read-only token on disk.
          persist-credentials: false
          # The release-source check below needs main's history as well as
          # the tagged commit. This repository is small enough that avoiding
          # shallow-history ambiguity is preferable to a custom fetch.
          fetch-depth: 0

      # Tag immutability prevents replacement after creation; this separate
      # assertion prevents an administrator from accidentally releasing a
      # version-bearing commit that never passed through protected main.
      - name: Verify release commit is on main
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          if ! git merge-base --is-ancestor "$RELEASE_SHA" origin/main; then
            echo "::error::release commit $RELEASE_SHA is not reachable from main"
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      # Reject lockfile entries that resolve anywhere other than the npm
      # registry over HTTPS before any dependency code executes. This
      # verifier is repository-owned and uses Node built-ins only.
      - name: Lint lockfile
        run: node scripts/verify-lockfile.mjs

      # --ignore-scripts keeps dev-dependency lifecycle scripts from running;
      # lint and build are invoked explicitly below.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      # Registry signatures and provenance attestations for everything that
      # participates in the build. Complements the lockfile verifier above:
      # integrity proves "the locked bytes", signatures prove "the registry
      # served them".
      - name: Verify registry signatures and provenance
        run: npm audit signatures

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Type-check tests
        run: npm run typecheck:test

      # Last gate before publish: nothing ships without the unit suite
      # passing in the same environment that built the tarball.
      - name: Unit tests
        run: npm test

      # The tarball must contain exactly the files in the checked-in
      # manifest; refuse to publish anything with drifted contents.
      - name: Verify package contents
        run: node scripts/verify-pack.mjs

      # The release tag must name the version package.json carries; a tag
      # cut before the version bump landed would otherwise publish the
      # previous version's code under the new tag.
      - name: Verify release tag matches package version
        id: pkg
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if [ "$name" != "homebridge-weather-noaa" ]; then
            echo "::error::unexpected package name $name"
            exit 1
          fi
          if [ "v$version" != "$TAG" ]; then
            echo "::error::release tag $TAG does not match package.json version $version"
            exit 1
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Generate SBOM (CycloneDX)
        run: npm sbom --sbom-format cyclonedx --omit dev > sbom.cdx.json

      # Pack once in the unprivileged job. The privileged job publishes
      # these exact bytes instead of rebuilding or executing the toolchain.
      - name: Pack release tarball
        run: npm pack --ignore-scripts

      - name: Compute transfer hashes
        id: artifact_hashes
        env:
          PKG: ${{ steps.pkg.outputs.name }}
          VERSION: ${{ steps.pkg.outputs.version }}
        run: |
          echo "tarball_sha256=$(sha256sum "$PKG-$VERSION.tgz" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "sbom_sha256=$(sha256sum sbom.cdx.json | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      # v4+ artifacts are immutable within a run. The receiving job also
      # checks each file's SHA-256 against the outputs above before use.
      - name: Upload release inputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-inputs
          path: |
            ${{ steps.pkg.outputs.name }}-${{ steps.pkg.outputs.version }}.tgz
            sbom.cdx.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  # Only this small job can mint the npm/Sigstore OIDC token. It does not
  # check out the repository, install dependencies, or execute build tools.
  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # attach the SBOM and tarball to the GitHub release
      id-token: write # npm trusted publishing and Sigstore keyless signing
    outputs:
      # Consumed by the isolated provenance generator below.
      hashes: ${{ steps.hash.outputs.hashes }}
    steps:
      # Block-mode egress control. The necessary npm and Sigstore endpoints
      # remain reachable, so privilege isolation—not the allowlist alone—is
      # what keeps development dependencies away from publishing authority.
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            fulcio.sigstore.dev:443
            github.com:443
            nodejs.org:443
            oauth2.sigstore.dev:443
            objects.githubusercontent.com:443
            registry.npmjs.org:443
            rekor.sigstore.dev:443
            release-assets.githubusercontent.com:443
            timestamp.sigstore.dev:443
            tuf-repo-cdn.sigstore.dev:443
            uploads.github.com:443

      # Node 24 bundles npm above the 11.5.1 trusted-publishing floor.
      # Caching stays disabled in the release-authority job.
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      # Derive publish metadata from the GitHub release event, not from the
      # unprivileged build job or transferred tarball.
      - name: Derive trusted release metadata
        id: release
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          node <<'NODE'
          const { appendFileSync } = require('node:fs');
          const tag = process.env.TAG ?? '';
          const semverTag = /^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?$/;
          if (!semverTag.test(tag)) {
            console.error(`::error::release tag ${tag} is not a supported semantic version`);
            process.exit(1);
          }
          appendFileSync(process.env.GITHUB_OUTPUT, 'name=homebridge-weather-noaa\n');
          appendFileSync(process.env.GITHUB_OUTPUT, `version=${tag.slice(1)}\n`);
          NODE

      - name: Download release inputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-inputs
          path: .

      - name: Verify transferred release inputs
        env:
          PKG: ${{ steps.release.outputs.name }}
          VERSION: ${{ steps.release.outputs.version }}
          EXPECTED_TARBALL_SHA256: ${{ needs.build.outputs.tarball_sha256 }}
          EXPECTED_SBOM_SHA256: ${{ needs.build.outputs.sbom_sha256 }}
        run: |
          set -euo pipefail
          test -f "$PKG-$VERSION.tgz"
          test -f sbom.cdx.json
          test "$(find . -maxdepth 1 -type f | wc -l)" -eq 2
          tar -xOf "$PKG-$VERSION.tgz" package/package.json | \
            node -e "let s=''; process.stdin.on('data', c => s += c).on('end', () => { const p=JSON.parse(s); if (p.name !== process.env.PKG || p.version !== process.env.VERSION) { console.error('::error::tarball package identity does not match the release'); process.exit(1); } });"
          printf '%s  %s\n' "$EXPECTED_TARBALL_SHA256" "$PKG-$VERSION.tgz" | sha256sum -c -
          printf '%s  %s\n' "$EXPECTED_SBOM_SHA256" sbom.cdx.json | sha256sum -c -

      - name: Verify npm supports trusted publishing
        run: |
          npm --version
          node -e "const [maj, min, pat] = require('child_process').execSync('npm --version').toString().trim().split('.').map(Number); if (maj < 11 || (maj === 11 && (min < 5 || (min === 5 && pat < 1)))) { console.error('npm >= 11.5.1 required for trusted publishing'); process.exit(1); }"

      # --provenance links the published tarball to this exact commit and
      # workflow run via a Sigstore attestation shown on npmjs.com.
      # Authentication happens via OIDC (id-token: write), not a token.
      #
      # Idempotent: npm refuses to publish over an existing version, so if
      # this job is re-run after a failure in a LATER step (signing,
      # upload), the publish is skipped and the rest of the job proceeds.
      # The registry integrity check below guarantees the transferred
      # tarball signed and attested on a re-run is byte-identical to what
      # the registry already serves.
      - name: Publish with provenance
        env:
          PKG: ${{ steps.release.outputs.name }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          if npm view "$PKG@$VERSION" version >/dev/null 2>&1; then
            echo "::notice::$PKG@$VERSION is already on the registry; skipping publish (re-run after a post-publish failure)."
          else
            # Defense in depth: a tarball should never gain lifecycle scripts,
            # but publishing authority must not execute them if one is tampered.
            npm publish "./$PKG-$VERSION.tgz" --ignore-scripts --provenance --access public
          fi

      # Keyless (Sigstore) signature over the SBOM: the same OIDC identity
      # that authenticates the npm publish signs the release asset, so there
      # is no long-lived signing key to store or leak. Verify with:
      #   cosign verify-blob sbom.cdx.json \
      #     --bundle sbom.cdx.json.sigstore.json \
      #     --certificate-oidc-issuer https://token.actions.githubusercontent.com \
      #     --certificate-identity \
      #       'https://github.com/Phirtue/homebridge-weather-noaa/.github/workflows/publish.yml@refs/tags/<tag>'
      # The installer action is SHA-pinned, but the cosign binary it fetches
      # is a separate input: pin it too, so the signing toolchain (and the
      # network endpoints it needs, see the allowlist above) only changes
      # when this line does.
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6

      - name: Sign SBOM (Sigstore keyless)
        run: cosign sign-blob --yes --bundle sbom.cdx.json.sigstore.json sbom.cdx.json

      # The transferred tarball must carry the exact
      # integrity hash the registry serves for this version. This is also
      # what makes the idempotent re-run path safe.
      - name: Verify packed tarball matches the registry
        env:
          PKG: ${{ steps.release.outputs.name }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          local_sri="sha512-$(openssl dgst -sha512 -binary "$PKG-$VERSION.tgz" | base64 -w0)"
          # The registry's read path lags the publish by a few seconds to a
          # few minutes (1.10.1 got a 404 four seconds after a successful
          # publish). Poll with a bound rather than fail on the first miss.
          remote_sri=""
          for attempt in $(seq 1 12); do
            remote_sri=$(npm view "$PKG@$VERSION" dist.integrity 2>/dev/null || true)
            [ -n "$remote_sri" ] && break
            echo "registry has not served $PKG@$VERSION yet (attempt $attempt/12); retrying in 15s"
            sleep 15
          done
          if [ -z "$remote_sri" ]; then
            echo "::error::registry never served $PKG@$VERSION; cannot verify the tarball"
            exit 1
          fi
          if [ "$local_sri" != "$remote_sri" ]; then
            echo "::error::packed tarball ($local_sri) differs from registry ($remote_sri)"
            exit 1
          fi
          echo "Tarball integrity matches the registry: $remote_sri"

      - name: Compute artifact hashes for provenance
        id: hash
        run: echo "hashes=$(sha256sum homebridge-weather-noaa-*.tgz sbom.cdx.json | base64 -w0)" >> "$GITHUB_OUTPUT"

      - name: Attach SBOM, signature, and tarball to release
        run: gh release upload "$TAG" sbom.cdx.json sbom.cdx.json.sigstore.json homebridge-weather-noaa-*.tgz --clobber
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}

  # SLSA build provenance, generated by the OpenSSF's isolated builder
  # workflow rather than by the publish job itself: the builder receives
  # only the artifact hashes, so even a compromised publish job cannot
  # forge provenance for different bytes. Referenced by tag, not SHA —
  # the generator requires this for its own internal verification, and
  # Scorecard explicitly exempts slsa-framework from pinning warnings.
  # Verify a release with:
  #   slsa-verifier verify-artifact homebridge-weather-noaa-<ver>.tgz \
  #     --provenance-path homebridge-weather-noaa.intoto.jsonl \
  #     --source-uri github.com/Phirtue/homebridge-weather-noaa
  provenance:
    needs: publish
    permissions:
      actions: read # read this workflow run's metadata into the provenance
      id-token: write # sign the provenance via Sigstore
      contents: write # upload the .intoto.jsonl to the release
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0 # zizmor: ignore[unpinned-uses] tag ref required by the generator's self-verification
    with:
      base64-subjects: ${{ needs.publish.outputs.hashes }}
      provenance-name: homebridge-weather-noaa.intoto.jsonl
      upload-assets: true
      upload-tag-name: ${{ github.event.release.tag_name }}
