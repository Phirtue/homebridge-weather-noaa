name: Publish to npm

# Publishes when a GitHub release is created. Authenticates via npm
# trusted publishing (GitHub Actions OIDC) — no npm token is stored
# anywhere. The trusted publisher for this workflow is configured on
# npmjs.com under the package's Settings.
on:
  release:
    types: [published]

# Read-only at the top level; write grants live on the job that needs
# them, so a job added later cannot inherit them by accident.
permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # attach the SBOM to the GitHub release
      id-token: write # OIDC token for npm provenance attestation
    outputs:
      # Consumed by the provenance job below; the hashes are the only thing
      # that crosses the job boundary.
      hashes: ${{ steps.hash.outputs.hashes }}
    steps:
      # Block-mode egress control. This job holds the highest-value token
      # in the repository (id-token: write for npm provenance), and it runs
      # npm ci of dev dependencies — exactly the code a supply-chain attack
      # would ride in on. Any outbound connection not on this list is
      # refused, so a compromised dependency cannot exfiltrate the OIDC
      # context. Endpoint list built from the audit-mode runs of prior
      # releases: GitHub (checkout, gh release upload, action downloads),
      # nodejs.org (setup-node fallback), npm registry, and Sigstore
      # (npm --provenance and cosign keyless signing, including the
      # timestamp authority that cosign v3 consults when producing a
      # bundle). GitHub Actions infrastructure endpoints (OIDC token
      # fetch, log upload) are implicitly allowed by harden-runner. A
      # missed endpoint fails the release loudly and is recoverable: fix
      # the list, re-run the job (the publish step is idempotent below).
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            fulcio.sigstore.dev:443
            github.com:443
            nodejs.org:443
            oauth2.sigstore.dev:443
            objects.githubusercontent.com:443
            registry.npmjs.org:443
            rekor.sigstore.dev:443
            release-assets.githubusercontent.com:443
            timestamp.sigstore.dev:443
            tuf-repo-cdn.sigstore.dev:443
            uploads.github.com:443

      # Actions pinned to commit SHAs so a compromised tag cannot inject code.
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # gh authenticates via the GH_TOKEN env var below; don't leave
          # the token on disk in a job holding publish capability.
          persist-credentials: false

      # Node 24 bundles npm >= 11.16, which satisfies the npm >= 11.5.1
      # floor for trusted publishing, so no separate npm upgrade (which
      # would be an unpinned install at release time) is needed.
      # package-manager-cache: false keeps this publishing job away from
      # the shared Actions cache entirely — a poisoned cache entry must
      # not be able to feed code into the environment that signs and
      # publishes the package.
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      # Reject lockfile entries that resolve anywhere other than the npm
      # registry over https (defends against lockfile poisoning).
      - name: Lint lockfile
        run: npx lockfile-lint@5.0.0 --path package-lock.json --allowed-hosts npm --validate-https

      # --ignore-scripts keeps dev-dependency lifecycle scripts from running;
      # lint and build are invoked explicitly below.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      # Last gate before publish: nothing ships without the unit suite
      # passing in the same environment that built the tarball.
      - name: Unit tests
        run: npm test

      # The tarball must contain exactly the files in the checked-in
      # manifest; refuse to publish anything with drifted contents.
      - name: Verify package contents
        run: node scripts/verify-pack.mjs

      # Guard the trusted-publishing floor explicitly, since it now relies
      # on the npm bundled with the Node version above.
      - name: Verify npm supports trusted publishing
        run: |
          npm --version
          node -e "const [maj, min, pat] = require('child_process').execSync('npm --version').toString().trim().split('.').map(Number); if (maj < 11 || (maj === 11 && (min < 5 || (min === 5 && pat < 1)))) { console.error('npm >= 11.5.1 required for trusted publishing'); process.exit(1); }"

      # The release tag must name the version package.json carries; a tag
      # cut before the version bump landed would otherwise publish the
      # previous version's code under the new tag.
      - name: Verify release tag matches package version
        id: pkg
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$TAG" ]; then
            echo "::error::release tag $TAG does not match package.json version $version"
            exit 1
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # --provenance links the published tarball to this exact commit and
      # workflow run via a Sigstore attestation shown on npmjs.com.
      # Authentication happens via OIDC (id-token: write), not a token.
      #
      # Idempotent: npm refuses to publish over an existing version, so if
      # this job is re-run after a failure in a LATER step (signing,
      # upload), the publish is skipped and the rest of the job proceeds.
      # The integrity check after `npm pack` below guarantees the artifacts
      # signed and attested on the re-run are byte-identical to what the
      # registry already serves.
      - name: Publish with provenance
        env:
          PKG: ${{ steps.pkg.outputs.name }}
          VERSION: ${{ steps.pkg.outputs.version }}
        run: |
          if npm view "$PKG@$VERSION" version >/dev/null 2>&1; then
            echo "::notice::$PKG@$VERSION is already on the registry; skipping publish (re-run after a post-publish failure)."
          else
            npm publish --provenance --access public
          fi

      - name: Generate SBOM (CycloneDX)
        run: npm sbom --sbom-format cyclonedx --omit dev > sbom.cdx.json

      # Keyless (Sigstore) signature over the SBOM: the same OIDC identity
      # that authenticates the npm publish signs the release asset, so there
      # is no long-lived signing key to store or leak. Verify with:
      #   cosign verify-blob sbom.cdx.json \
      #     --bundle sbom.cdx.json.sigstore.json \
      #     --certificate-oidc-issuer https://token.actions.githubusercontent.com \
      #     --certificate-identity-regexp 'github.com/Phirtue/homebridge-weather-noaa'
      # The installer action is SHA-pinned, but the cosign binary it fetches
      # is a separate input: pin it too, so the signing toolchain (and the
      # network endpoints it needs, see the allowlist above) only changes
      # when this line does.
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6

      - name: Sign SBOM (Sigstore keyless)
        run: cosign sign-blob --yes --bundle sbom.cdx.json.sigstore.json sbom.cdx.json

      # npm pack is byte-identical to what npm publish sent (same tree, and
      # pack normalizes timestamps), so hashing this tarball lets the SLSA
      # provenance below cover the artifact users actually install.
      - name: Pack tarball for provenance
        run: npm pack

      # Turn the byte-identical assumption above into a checked fact: the
      # tarball about to be attested and attached must carry the exact
      # integrity hash the registry serves for this version. This is also
      # what makes the idempotent re-run path safe.
      - name: Verify packed tarball matches the registry
        env:
          PKG: ${{ steps.pkg.outputs.name }}
          VERSION: ${{ steps.pkg.outputs.version }}
        run: |
          local_sri="sha512-$(openssl dgst -sha512 -binary "$PKG-$VERSION.tgz" | base64 -w0)"
          remote_sri=$(npm view "$PKG@$VERSION" dist.integrity)
          if [ "$local_sri" != "$remote_sri" ]; then
            echo "::error::packed tarball ($local_sri) differs from registry ($remote_sri)"
            exit 1
          fi
          echo "Tarball integrity matches the registry: $remote_sri"

      - name: Compute artifact hashes for provenance
        id: hash
        run: echo "hashes=$(sha256sum homebridge-weather-noaa-*.tgz sbom.cdx.json | base64 -w0)" >> "$GITHUB_OUTPUT"

      - name: Attach SBOM, signature, and tarball to release
        run: gh release upload "$TAG" sbom.cdx.json sbom.cdx.json.sigstore.json homebridge-weather-noaa-*.tgz --clobber
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}

  # SLSA build provenance, generated by the OpenSSF's isolated builder
  # workflow rather than by the publish job itself: the builder receives
  # only the artifact hashes, so even a compromised publish job cannot
  # forge provenance for different bytes. Referenced by tag, not SHA —
  # the generator requires this for its own internal verification, and
  # Scorecard explicitly exempts slsa-framework from pinning warnings.
  # Verify a release with:
  #   slsa-verifier verify-artifact homebridge-weather-noaa-<ver>.tgz \
  #     --provenance-path homebridge-weather-noaa.intoto.jsonl \
  #     --source-uri github.com/Phirtue/homebridge-weather-noaa
  provenance:
    needs: publish
    permissions:
      actions: read # read this workflow run's metadata into the provenance
      id-token: write # sign the provenance via Sigstore
      contents: write # upload the .intoto.jsonl to the release
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0 # zizmor: ignore[unpinned-uses] tag ref required by the generator's self-verification
    with:
      base64-subjects: ${{ needs.publish.outputs.hashes }}
      provenance-name: homebridge-weather-noaa.intoto.jsonl
      upload-assets: true
      upload-tag-name: ${{ github.event.release.tag_name }}
